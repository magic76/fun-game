name: Deploy Mini Toys to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'spin-art/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/spin-art
          cp index.html _site/index.html
          cp spin-art/index.html _site/spin-art/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "github-pages artifact is visible (attempt $attempt)"
              exit 0
            fi
            echo "Artifact not visible yet (attempt $attempt); waiting 5 seconds"
            sleep 5
          done
          echo "::error::github-pages artifact did not become visible to the API"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
