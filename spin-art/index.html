<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轉盤畫室 · Spin Art</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e8;color:#26253a;font-family:system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}h1{margin:0;font-size:clamp(28px,5vw,42px)}p{color:#646275}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:20px}.stage{display:grid;place-items:center;aspect-ratio:1;background:#e9e1d6;border-radius:24px;touch-action:none;overflow:hidden} .stage{position:relative}.turn-stick{position:absolute;bottom:12px;width:48px;height:86px;border:1px solid #a99cce;background:#fffdf3e8;border-radius:24px;z-index:3;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:ns-resize;box-shadow:0 3px 12px #0002;user-select:none}.turn-stick.left{left:10px}.turn-stick.right{right:10px}.turn-stick .track{height:55px;width:7px;background:#d7cfee;border-radius:6px;position:relative}.turn-stick .knob{position:absolute;top:50%;left:50%;width:31px;height:19px;border-radius:12px;background:#7362cc;box-shadow:0 2px 6px #0003;transform:translate(-50%,-50%)}.turn-stick:active .knob{background:#49399b}.turn-stick[hidden]{display:none!important}.rim-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#22223b;border:3px solid white;box-shadow:0 1px 5px #0005;pointer-events:none;z-index:2;transform:translate(-50%,-50%)}canvas{width:92%;height:92%;border-radius:50%;background:white;touch-action:none;box-shadow:0 12px 30px #0002;cursor:crosshair}.panel{background:white;padding:20px;border-radius:22px;display:flex;flex-direction:column;gap:15px;box-shadow:0 8px 24px #0001}label{display:flex;flex-direction:column;gap:7px;font-weight:650}input[type=range]{width:100%;accent-color:#7362cc}input[type=color]{width:64px;height:42px;border:0;background:none}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;background:#7362cc;color:white;padding:12px;cursor:pointer;font-weight:700;flex:1;min-width:90px}button.secondary{background:#eeeafa;color:#4d408c}button[aria-pressed=true]{outline:3px solid #d7cdfd}.palette-group{display:flex;flex-direction:column;gap:6px}.palette-title{font-size:13px;font-weight:700}.palette{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;align-items:center}.swatch{width:100%;aspect-ratio:1;border:2px solid #e4e0eb;border-radius:50%;padding:0;min-width:0;cursor:pointer;position:relative;background:var(--swatch)}.swatch[aria-pressed=true]{outline:3px solid #7362cc;outline-offset:1px;border-color:white}.swatch[aria-pressed=true]::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--check)}.custom-color{position:relative;display:grid;place-items:center;border-radius:50%;aspect-ratio:1;width:100%;border:2px dashed #9c91bc;overflow:hidden;font-size:20px;font-weight:800;color:#5b4e85;cursor:pointer}.custom-color input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.custom-color:focus-within{outline:3px solid #7362cc;outline-offset:1px}.hint{font-size:14px;line-height:1.6;margin:0}footer{font-size:13px;color:#777;text-align:center;margin-top:22px}@media(max-width:720px){.layout{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:16px}}@media(max-width:720px){html,body{height:100%;overflow:hidden}.wrap{height:100dvh;display:flex;flex-direction:column;padding:8px 12px;gap:5px}.wrap>h1{font-size:20px;line-height:1.1}.wrap>p{display:none}.layout{display:flex;flex-direction:column;flex:1;min-height:0;margin:0;gap:8px}.stage{flex:1;min-height:0;aspect-ratio:auto;border-radius:14px}.stage canvas{display:block;width:min(92%,calc(100dvh - 310px));height:auto;max-height:92%;aspect-ratio:1/1;object-fit:contain;flex:none}.panel{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px;border-radius:14px;box-shadow:none}.panel>label:first-child{display:none}.panel>.buttons:first-of-type{grid-column:1/-1}.panel label{font-size:12px;gap:2px}.panel button{font-size:12px;min-width:0;padding:9px 5px;border-radius:9px}.panel .buttons{gap:5px}.panel #autoControls,.panel #manualControls{grid-column:1/-1}.panel #autoControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}.panel #manualControls:not([hidden]){display:block}.panel #manualControls .hint{display:block;font-size:11px;line-height:1.25;margin:2px 0}.panel #autoControls .buttons{align-self:end}.panel #autoControls label{min-width:0}.panel #hint{display:none}.panel>.palette-group{grid-column:1/-1}.palette{gap:6px}.palette-title{font-size:12px}.swatch[aria-pressed=true]::after{font-size:12px}.panel>.buttons:last-child{grid-column:1/-1}.panel input[type=color]{height:28px;width:50px}.panel input[type=range]{height:18px}.wrap footer{display:none}}@media(max-width:720px) and (max-height:700px){.wrap{padding:5px 9px}.panel{padding:7px;gap:4px}.panel button{padding:6px 4px}.stage canvas{width:min(92%,calc(100dvh - 265px));height:auto;max-height:92%;aspect-ratio:1/1}}</style></head><body><main class="wrap"><h1>轉盤畫室</h1><p>畫畫、轉動、下載作品，全部在同一個畫面。</p><div class="layout"><div class="stage"><canvas id="art" width="1000" height="1000" aria-label="旋轉畫盤"></canvas><span id="rimDot" class="rim-dot" aria-hidden="true"></span><div id="stickLeft" class="turn-stick left" role="slider" tabindex="0" aria-label="左側旋轉搖桿" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0" hidden><span class="track"><span class="knob"></span></span></div><div id="stickRight" class="turn-stick right" role="slider" tabindex="0" aria-label="右側旋轉搖桿" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0" hidden><span class="track"><span class="knob"></span></span></div></div><section class="panel"><label>旋轉方式</label><div class="buttons"><button id="auto" aria-pressed="true">自動旋轉</button><button id="manual" class="secondary" aria-pressed="false">手動旋轉</button></div><div id="autoControls"><label>轉速 <span id="speedValue">180°/秒</span><input id="speed" type="range" min="0" max="720" step="10" value="180"></label><div class="buttons"><button id="cw" aria-pressed="true">↻ 順時針</button><button id="ccw" class="secondary" aria-pressed="false">↺ 逆時針</button></div></div><div id="manualControls" hidden><p class="hint">拖曳圓盤左下或右下的紫色搖桿，上下移動旋轉；圓盤內側直接畫畫。</p></div><div class="palette-group"><div class="palette-title">畫筆顏色</div><div id="palette" class="palette" role="group" aria-label="快速選擇畫筆顏色"><button type="button" class="swatch" style="--swatch:#22223b;--check:#ffffff" data-color="#22223b" aria-label="深色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ffffff;--check:#22223b" data-color="#ffffff" aria-label="白色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ef4444;--check:#ffffff" data-color="#ef4444" aria-label="紅色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#f97316;--check:#ffffff" data-color="#f97316" aria-label="橘色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#facc15;--check:#22223b" data-color="#facc15" aria-label="黃色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#22c55e;--check:#ffffff" data-color="#22c55e" aria-label="綠色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#06b6d4;--check:#ffffff" data-color="#06b6d4" aria-label="青色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#3b82f6;--check:#ffffff" data-color="#3b82f6" aria-label="藍色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#8b5cf6;--check:#ffffff" data-color="#8b5cf6" aria-label="紫色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ec4899;--check:#ffffff" data-color="#ec4899" aria-label="粉紅" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#a16207;--check:#ffffff" data-color="#a16207" aria-label="棕色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#f16a70;--check:#ffffff" data-color="#f16a70" aria-label="珊瑚紅" aria-pressed="true"></button><label class="custom-color" aria-label="自訂畫筆顏色">＋<input id="color" type="color" value="#f16a70" aria-label="開啟自訂顏色選擇器"></label></div></div><label>畫筆粗細 <span id="sizeValue">18 px</span><input id="size" type="range" min="1" max="70" value="18"></label><p class="hint" id="hint">手指按住不動會畫出圓弧；慢慢往中心移動，試試螺旋。</p><div class="buttons"><button id="clear" class="secondary">清空畫布</button><button id="save">下載 PNG</button></div></section></div><footer>作品僅保存在此頁，離開前記得下載。</footer></main><script>(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#art'),ctx=c.getContext('2d'),off=document.createElement('canvas');off.width=off.height=1000;const g=off.getContext('2d');let mode='auto',dir=1,angle=0,last=performance.now();const pointers=new Map();function clear(){g.clearRect(0,0,1000,1000);g.fillStyle='#fff';g.beginPath();g.arc(500,500,500,0,Math.PI*2);g.fill()}clear();function screen(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*1000-500,y:(e.clientY-b.top)/b.height*1000-500}}function local(p){const co=Math.cos(-angle),si=Math.sin(-angle);return{x:500+p.x*co-p.y*si,y:500+p.x*si+p.y*co}}function stroke(a,b){g.save();g.beginPath();g.arc(500,500,500,0,Math.PI*2);g.clip();g.strokeStyle=$('#color').value;g.lineWidth=+$('#size').value;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore()}function polar(p){return Math.atan2(p.y,p.x)}function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(mode==='auto')angle+=dir*(+$('#speed').value)*Math.PI/180*dt;for(const active of pointers.values()){if(active.kind==='draw'){const next=local(active.screen);stroke(active.point,next);active.point=next}}ctx.clearRect(0,0,1000,1000);ctx.save();ctx.translate(500,500);ctx.rotate(angle);ctx.drawImage(off,-500,-500);ctx.restore();const rect=c.getBoundingClientRect(),stageRect=c.parentElement.getBoundingClientRect(),radius=rect.width/2+10,dot=$('#rimDot');dot.style.left=(rect.left-stageRect.left+rect.width/2+Math.sin(angle)*radius)+'px';dot.style.top=(rect.top-stageRect.top+rect.height/2-Math.cos(angle)*radius)+'px';requestAnimationFrame(frame)}function setPressed(id,yes){$(id).setAttribute('aria-pressed',String(yes));$(id).classList.toggle('secondary',!yes)}function setMode(m){mode=m;pointers.clear();setPressed('#auto',m==='auto');setPressed('#manual',m==='manual');$('#autoControls').hidden=m!=='auto';$('#manualControls').hidden=m!=='manual';$('#stickLeft').hidden=m!=='manual';$('#stickRight').hidden=m!=='manual';$('#hint').textContent=m==='auto'?'手指按住不動會畫出圓弧；慢慢往中心移動，試試螺旋。':'拖曳左下或右下紫色搖桿旋轉，盤面直接畫畫。'}c.addEventListener('pointerdown',e=>{const p=screen(e);if(Math.hypot(p.x,p.y)>500)return;e.preventDefault();c.setPointerCapture(e.pointerId);const point=local(p);pointers.set(e.pointerId,{kind:'draw',point,screen:p});stroke(point,point)});c.addEventListener('pointermove',e=>{const active=pointers.get(e.pointerId);if(!active)return;e.preventDefault();const p=screen(e);const next=local(p);stroke(active.point,next);active.point=next;active.screen=p});function stop(e){pointers.delete(e.pointerId)}['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,stop));for(const stick of [$('#stickLeft'),$('#stickRight')]){const knob=stick.querySelector('.knob');const held=new Map();function update(){let offset=0;for(const v of held.values())offset+=v;offset=Math.max(-24,Math.min(24,offset));knob.style.top=(50+offset/24*30)+'%';stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))}stick.addEventListener('pointerdown',e=>{if(mode!=='manual')return;e.preventDefault();stick.setPointerCapture(e.pointerId);held.set(e.pointerId,e.clientY);update()});stick.addEventListener('pointermove',e=>{if(!held.has(e.pointerId))return;e.preventDefault();const previous=held.get(e.pointerId);angle+=(previous-e.clientY)*Math.PI/180;held.set(e.pointerId,e.clientY);const shift=Math.max(-24,Math.min(24,(previous-e.clientY)*2));knob.style.top=(50-shift/24*30)+'%';stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))});for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{held.delete(e.pointerId);knob.style.top='50%'});stick.addEventListener('keydown',e=>{if(mode!=='manual')return;if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();angle+=(e.key==='ArrowUp'?1:-1)*Math.PI/18;stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))}})}$('#auto').onclick=()=>setMode('auto');$('#manual').onclick=()=>setMode('manual');$('#cw').onclick=()=>{dir=1;setPressed('#cw',true);setPressed('#ccw',false)};$('#ccw').onclick=()=>{dir=-1;setPressed('#cw',false);setPressed('#ccw',true)};$('#speed').oninput=()=>$('#speedValue').textContent=$('#speed').value+'°/秒';function syncPalette(){const value=$('#color').value.toLowerCase();document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===value)));$('.custom-color').style.background=value;$('.custom-color').style.color=['#ffffff','#facc15'].includes(value)?'#22223b':'#ffffff'}document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{$('#color').value=b.dataset.color;syncPalette()}));$('#color').addEventListener('input',syncPalette);syncPalette();$('#size').oninput=()=>$('#sizeValue').textContent=$('#size').value+' px';$('#clear').onclick=clear;$('#save').onclick=()=>{const exportCanvas=document.createElement('canvas');exportCanvas.width=exportCanvas.height=1000;const x=exportCanvas.getContext('2d');x.translate(500,500);x.rotate(angle);x.drawImage(off,-500,-500);const a=document.createElement('a');a.download='spin-art.png';a.href=exportCanvas.toDataURL('image/png');a.click()};requestAnimationFrame(frame)})();</script></body></html>
