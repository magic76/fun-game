<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轉盤畫室 · Spin Art</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e8;color:#26253a;font-family:system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}h1{margin:0;font-size:clamp(28px,5vw,42px)}p{color:#646275}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:20px}.stage{display:grid;place-items:center;aspect-ratio:1;background:#e9e1d6;border-radius:24px;touch-action:none;overflow:hidden} .stage{position:relative}.turn-stick{position:absolute;bottom:12px;width:48px;height:86px;border:1px solid #a99cce;background:#fffdf3e8;border-radius:24px;z-index:3;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:ns-resize;box-shadow:0 3px 12px #0002;user-select:none}.turn-stick.left{left:10px}.turn-stick.right{right:10px}.turn-stick .track{height:55px;width:7px;background:#d7cfee;border-radius:6px;position:relative}.turn-stick .knob{position:absolute;top:50%;left:50%;width:31px;height:19px;border-radius:12px;background:#7362cc;box-shadow:0 2px 6px #0003;transform:translate(-50%,-50%)}.turn-stick:active .knob{background:#49399b}.turn-stick[hidden]{display:none!important}.rim-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#22223b;border:3px solid white;box-shadow:0 1px 5px #0005;pointer-events:none;z-index:2;transform:translate(-50%,-50%)}canvas{width:92%;height:92%;border-radius:50%;background:white;touch-action:none;box-shadow:0 12px 30px #0002;cursor:crosshair}.panel{background:white;padding:20px;border-radius:22px;display:flex;flex-direction:column;gap:15px;box-shadow:0 8px 24px #0001}label{display:flex;flex-direction:column;gap:7px;font-weight:650}input[type=range]{width:100%;accent-color:#7362cc}input[type=color]{width:64px;height:42px;border:0;background:none}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;background:#7362cc;color:white;padding:12px;cursor:pointer;font-weight:700;flex:1;min-width:90px}button.secondary{background:#eeeafa;color:#4d408c}button:disabled{opacity:.42;cursor:not-allowed}button[aria-pressed=true]{outline:3px solid #d7cdfd}.examples{display:flex;flex-direction:column;gap:5px}.examples-title{font-size:13px;font-weight:700}.examples-header{display:flex;align-items:center;justify-content:space-between;gap:8px}.examples-header button{flex:0 0 auto;min-width:0;padding:7px 10px;font-size:12px}.example-options:not(.expanded){display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;gap:6px}.example-options:not(.expanded) button{flex:0 0 auto;min-width:105px;padding:9px 10px}.example-options.expanded{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.example-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.example-options button{font-size:12px;min-width:0;padding:9px 3px;background:#eeeafa;color:#4d408c}.example-options button:focus-visible{outline:3px solid #7362cc}.palette-group{display:flex;flex-direction:column;gap:6px}.palette-title{font-size:13px;font-weight:700}.palette{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;align-items:center}.swatch{width:100%;aspect-ratio:1;border:2px solid #e4e0eb;border-radius:50%;padding:0;min-width:0;cursor:pointer;position:relative;background:var(--swatch)}.swatch[aria-pressed=true]{outline:3px solid #7362cc;outline-offset:1px;border-color:white}.swatch[aria-pressed=true]::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--check)}.custom-color{position:relative;display:grid;place-items:center;border-radius:50%;aspect-ratio:1;width:100%;border:2px dashed #9c91bc;overflow:hidden;font-size:20px;font-weight:800;color:#5b4e85;cursor:pointer}.custom-color input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.custom-color:focus-within{outline:3px solid #7362cc;outline-offset:1px}.hint{font-size:14px;line-height:1.6;margin:0}.quickbar{display:flex;gap:6px}.quickbar button{min-width:0;font-size:12px;padding:10px 7px}.quickbar #toggleTools{flex:2}.tool-body{display:flex;flex-direction:column;gap:15px}.panel:has(.tool-body:not(.open)) .tool-body{display:none}.example-options.expanded{grid-template-columns:repeat(3,minmax(0,1fr))}.frame-note{font-size:11px;color:#646275}footer{font-size:13px;color:#777;text-align:center;margin-top:22px}@media(max-width:720px){.layout{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:16px}}@media(max-width:720px){html,body{height:100%;overflow:hidden}.wrap{height:100dvh;display:flex;flex-direction:column;padding:8px 12px;gap:5px}.wrap>h1{font-size:20px;line-height:1.1}.wrap>p{display:none}.layout{display:flex;flex-direction:column;flex:1;min-height:0;margin:0;gap:8px}.stage{flex:1;min-height:0;aspect-ratio:auto;border-radius:14px}.stage canvas{display:block;width:min(92%,calc(100dvh - 130px));height:auto;max-height:94%;aspect-ratio:1/1;object-fit:contain;flex:none}.panel{flex:none;display:block;padding:8px;border-radius:14px;box-shadow:none}.tool-body{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:48dvh;overflow:auto;overscroll-behavior:contain;margin-top:7px}.tool-body:not(.open){display:none}.quickbar button{font-size:12px;padding:9px 4px}.panel>label:first-child{display:none}.tool-body>.buttons:first-of-type{grid-column:1/-1}.panel label{font-size:12px;gap:2px}.panel button{font-size:12px;min-width:0;padding:9px 5px;border-radius:9px}.panel .buttons{gap:5px}.tool-body #autoControls,.tool-body #manualControls{grid-column:1/-1}.panel #fpsControls{grid-column:1/-1}.panel #autoControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}.panel #manualControls:not([hidden]){display:block}.panel #manualControls .hint{display:block;font-size:11px;line-height:1.25;margin:2px 0}.panel #autoControls .buttons{align-self:end}.panel #autoControls label{min-width:0}.panel #hint{display:none}.tool-body>.palette-group,.tool-body>.examples{grid-column:1/-1}.example-options button{font-size:11px;padding:7px 2px}.example-options:not(.expanded) button{padding:8px 9px}.palette{gap:6px}.palette-title{font-size:12px}.swatch[aria-pressed=true]::after{font-size:12px}.tool-body>.buttons:last-child{grid-column:1/-1}.panel input[type=color]{height:28px;width:50px}.panel input[type=range]{height:18px}.panel select{width:100%;padding:7px;border:1px solid #d7cfee;border-radius:8px;background:#fff;color:#26253a}.wrap footer{display:none}}@media(max-width:720px) and (max-height:700px){.wrap{padding:5px 9px}.panel{padding:7px;gap:4px}.panel button{padding:6px 4px}.stage canvas{width:min(92%,calc(100dvh - 115px));height:auto;max-height:94%;aspect-ratio:1/1}}</style></head><body><main class="wrap"><h1>轉盤畫室</h1><p>畫畫、轉動、下載作品，全部在同一個畫面。</p><div class="layout"><div class="stage"><canvas id="art" width="1000" height="1000" aria-label="旋轉畫盤"></canvas><span id="rimDot" class="rim-dot" aria-hidden="true"></span><div id="stickLeft" class="turn-stick left" role="slider" tabindex="0" aria-label="左側旋轉搖桿" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0" hidden><span class="track"><span class="knob"></span></span></div><div id="stickRight" class="turn-stick right" role="slider" tabindex="0" aria-label="右側旋轉搖桿" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0" hidden><span class="track"><span class="knob"></span></span></div></div><section class="panel"><div class="quickbar"><button type="button" id="toggleTools" class="secondary" aria-expanded="false" aria-controls="toolBody">🎨 繪畫技巧／工具 ▾</button><button type="button" id="quickUndo" class="secondary">↶ 復原</button><button type="button" id="quickShare">分享</button></div><div id="toolBody" class="tool-body"><label>旋轉方式</label><div class="buttons"><button id="auto" aria-pressed="true">自動旋轉</button><button id="manual" class="secondary" aria-pressed="false">手動旋轉</button></div><div id="autoControls"><label>轉速 <span id="speedValue">180°/秒</span><input id="speed" type="range" min="0" max="720" step="10" value="180"></label><div class="buttons"><button id="cw" aria-pressed="true">↻ 順時針</button><button id="ccw" class="secondary" aria-pressed="false">↺ 逆時針</button></div></div><div id="fpsControls"><label>畫面更新率 <span id="fpsValue">60 FPS</span><select id="fps" aria-label="畫面更新率"><option value="60">60 FPS</option><option value="30">30 FPS</option><option value="24">24 FPS</option><option value="15">15 FPS</option><option value="10">10 FPS</option></select></label></div><div id="manualControls" hidden><p class="hint">拖曳圓盤左下或右下的紫色搖桿，上下移動旋轉；圓盤內側直接畫畫。</p></div><div class="examples"><div class="examples-header"><span class="examples-title">圖案範例 <span id="exampleCount">11 種</span></span><button type="button" id="toggleExamples" class="secondary" aria-expanded="false" aria-controls="exampleOptions">展開全部 ▾</button></div><div class="example-options" id="exampleOptions"><button type="button" data-technique="benham">🌈 黑白幻彩</button><button type="button" data-technique="pinwheel">◐ 旋轉扇葉</button><button type="button" data-technique="checker">▦ 棋盤漩渦</button><button type="button" data-technique="rays">✺ 放射光芒</button><button type="button" data-technique="artist">◎ 粗細線光學</button><button type="button" data-technique="rings">◎ 同心圓</button><button type="button" data-technique="spiral">🌀 螺旋</button><button type="button" data-technique="dashes">✳ 放射短線</button><button type="button" data-technique="waves">〰 波浪環</button><button type="button" data-technique="petals">🌸 花瓣環</button><button type="button" data-technique="orbit">◉ 軌道線</button></div></div><div class="palette-group"><div class="palette-title">畫筆顏色</div><div id="palette" class="palette" role="group" aria-label="快速選擇畫筆顏色"><button type="button" class="swatch" style="--swatch:#22223b;--check:#ffffff" data-color="#22223b" aria-label="深色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ffffff;--check:#22223b" data-color="#ffffff" aria-label="白色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ef4444;--check:#ffffff" data-color="#ef4444" aria-label="紅色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#f97316;--check:#ffffff" data-color="#f97316" aria-label="橘色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#facc15;--check:#22223b" data-color="#facc15" aria-label="黃色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#22c55e;--check:#ffffff" data-color="#22c55e" aria-label="綠色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#06b6d4;--check:#ffffff" data-color="#06b6d4" aria-label="青色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#3b82f6;--check:#ffffff" data-color="#3b82f6" aria-label="藍色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#8b5cf6;--check:#ffffff" data-color="#8b5cf6" aria-label="紫色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ec4899;--check:#ffffff" data-color="#ec4899" aria-label="粉紅" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#a16207;--check:#ffffff" data-color="#a16207" aria-label="棕色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#f16a70;--check:#ffffff" data-color="#f16a70" aria-label="珊瑚紅" aria-pressed="true"></button><label class="custom-color" aria-label="自訂畫筆顏色">＋<input id="color" type="color" value="#f16a70" aria-label="開啟自訂顏色選擇器"></label></div></div><label>畫筆粗細 <span id="sizeValue">18 px</span><input id="size" type="range" min="1" max="70" value="18"></label><p class="hint" id="hint">手指按住不動會畫出圓弧；慢慢往中心移動，試試螺旋。</p><div class="buttons"><button id="undo" class="secondary" disabled>↶ 復原</button><button id="clear" class="secondary">清空畫布</button><button id="save">下載 PNG</button><button id="share">分享作品</button></div></div></section></div><footer>作品僅保存在此頁，離開前記得下載。</footer></main><script>(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#art'),ctx=c.getContext('2d'),off=document.createElement('canvas');off.width=off.height=1000;const g=off.getContext('2d');let mode='auto',dir=1,angle=0,last=performance.now(),lastPaint=0;const pointers=new Map(),history=[];const MAX_UNDO=12;function saveHistory(){if(history.length===MAX_UNDO)history.shift();history.push(g.getImageData(0,0,1000,1000));$('#undo').disabled=false}function undo(){if(!history.length)return;pointers.clear();g.putImageData(history.pop(),0,0);$('#undo').disabled=!history.length}function clear(){g.clearRect(0,0,1000,1000);g.fillStyle='#fff';g.beginPath();g.arc(500,500,500,0,Math.PI*2);g.fill()}clear();function screen(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*1000-500,y:(e.clientY-b.top)/b.height*1000-500}}function local(p){const co=Math.cos(-angle),si=Math.sin(-angle);return{x:500+p.x*co-p.y*si,y:500+p.x*si+p.y*co}}function stroke(a,b){g.save();g.beginPath();g.arc(500,500,500,0,Math.PI*2);g.clip();g.strokeStyle=$('#color').value;g.lineWidth=+$('#size').value;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore()}function polar(p){return Math.atan2(p.y,p.x)}function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(mode==='auto')angle+=dir*(+$('#speed').value)*Math.PI/180*dt;for(const active of pointers.values()){if(active.kind==='draw'){const next=local(active.screen);stroke(active.point,next);active.point=next}}const fps=+$('#fps').value;if(!lastPaint||now-lastPaint>=1000/fps){lastPaint=now;ctx.clearRect(0,0,1000,1000);ctx.save();ctx.translate(500,500);ctx.rotate(angle);ctx.drawImage(off,-500,-500);ctx.restore();}const rect=c.getBoundingClientRect(),stageRect=c.parentElement.getBoundingClientRect(),radius=rect.width/2+10,dot=$('#rimDot');dot.style.left=(rect.left-stageRect.left+rect.width/2+Math.sin(angle)*radius)+'px';dot.style.top=(rect.top-stageRect.top+rect.height/2-Math.cos(angle)*radius)+'px';requestAnimationFrame(frame)}$('#fps').addEventListener('change',()=>{$('#fpsValue').textContent=$('#fps').value+' FPS';lastPaint=0});function setPressed(id,yes){$(id).setAttribute('aria-pressed',String(yes));$(id).classList.toggle('secondary',!yes)}function setMode(m){mode=m;pointers.clear();setPressed('#auto',m==='auto');setPressed('#manual',m==='manual');$('#autoControls').hidden=m!=='auto';$('#manualControls').hidden=m!=='manual';$('#stickLeft').hidden=m!=='manual';$('#stickRight').hidden=m!=='manual';$('#hint').textContent=m==='auto'?'手指按住不動會畫出圓弧；慢慢往中心移動，試試螺旋。':'拖曳左下或右下紫色搖桿旋轉，盤面直接畫畫。'}c.addEventListener('pointerdown',e=>{const p=screen(e);if(Math.hypot(p.x,p.y)>500)return;e.preventDefault();c.setPointerCapture(e.pointerId);if(pointers.size===0)saveHistory();const point=local(p);pointers.set(e.pointerId,{kind:'draw',point,screen:p});stroke(point,point)});c.addEventListener('pointermove',e=>{const active=pointers.get(e.pointerId);if(!active)return;e.preventDefault();const p=screen(e);const next=local(p);stroke(active.point,next);active.point=next;active.screen=p});function stop(e){pointers.delete(e.pointerId)}['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,stop));for(const stick of [$('#stickLeft'),$('#stickRight')]){const knob=stick.querySelector('.knob');const held=new Map();function update(){let offset=0;for(const v of held.values())offset+=v;offset=Math.max(-24,Math.min(24,offset));knob.style.top=(50+offset/24*30)+'%';stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))}stick.addEventListener('pointerdown',e=>{if(mode!=='manual')return;e.preventDefault();stick.setPointerCapture(e.pointerId);held.set(e.pointerId,e.clientY);update()});stick.addEventListener('pointermove',e=>{if(!held.has(e.pointerId))return;e.preventDefault();const previous=held.get(e.pointerId);angle+=(previous-e.clientY)*Math.PI/180;held.set(e.pointerId,e.clientY);const shift=Math.max(-24,Math.min(24,(previous-e.clientY)*2));knob.style.top=(50-shift/24*30)+'%';stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))});for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{held.delete(e.pointerId);knob.style.top='50%'});stick.addEventListener('keydown',e=>{if(mode!=='manual')return;if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();angle+=(e.key==='ArrowUp'?1:-1)*Math.PI/18;stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))}})}$('#auto').onclick=()=>setMode('auto');$('#manual').onclick=()=>setMode('manual');$('#cw').onclick=()=>{dir=1;setPressed('#cw',true);setPressed('#ccw',false)};$('#ccw').onclick=()=>{dir=-1;setPressed('#cw',false);setPressed('#ccw',true)};$('#speed').oninput=()=>$('#speedValue').textContent=$('#speed').value+'°/秒';function syncPalette(){const value=$('#color').value.toLowerCase();document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===value)));$('.custom-color').style.background=value;$('.custom-color').style.color=['#ffffff','#facc15'].includes(value)?'#22223b':'#ffffff'}document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{$('#color').value=b.dataset.color;syncPalette()}));$('#color').addEventListener('input',syncPalette);syncPalette();$('#size').oninput=()=>$('#sizeValue').textContent=$('#size').value+' px';function loadTechnique(type){saveHistory();pointers.clear();clear();const pi=Math.PI;g.save();g.beginPath();g.arc(500,500,498,0,2*pi);g.clip();g.translate(500,500);g.lineCap='round';g.lineJoin='round';const colors=['#7362cc','#f16a70','#06b6d4','#f59e0b','#22c55e'];if(type==='benham'){g.fillStyle='#fff';g.fillRect(-500,-500,1000,1000);g.fillStyle='#000';g.beginPath();g.moveTo(0,-490);g.arc(0,0,490,-pi/2,pi/2,true);g.closePath();g.fill();g.strokeStyle='#000';g.lineCap='butt';g.lineWidth=8;for(let group=0;group<4;group++){for(let i=0;i<3;i++){const radius=110+group*94+i*19;const start=-pi/2+.10+group*.31;g.beginPath();g.arc(0,0,radius,start,start+.22);g.stroke()}}}else if(type==='pinwheel'){for(let i=0;i<24;i++){const a=i*2*pi/24;g.save();g.rotate(a);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(160,-65,475,0);g.quadraticCurveTo(230,42,0,0);g.fillStyle=i%2?'#111827':'#fff';g.fill();g.restore()}}else if(type==='checker'){for(let ring=0;ring<18;ring++){const r=ring*27,n=24+ring*2;for(let i=0;i<n;i++){if((i+ring)%2)continue;g.beginPath();g.arc(0,0,r+25,i*2*pi/n+ring*.025,(i+1)*2*pi/n+ring*.025);g.arc(0,0,r,(i+1)*2*pi/n+ring*.025,i*2*pi/n+ring*.025,true);g.closePath();g.fillStyle='#171717';g.fill()}}}else if(type==='rays'){for(let i=0;i<96;i++){const a=i*2*pi/96;g.save();g.rotate(a);g.beginPath();g.moveTo(30,0);g.lineTo(480,i%2?4:-4);g.lineWidth=i%3===0?7:2;g.strokeStyle=i%4===0?'#e23c44':'#1f2937';g.stroke();g.restore()}}else if(type==='artist'){g.fillStyle='#fff';g.fillRect(-500,-500,1000,1000);g.lineCap='butt';const widths=[2,2,3,11,2,5,1.5,15,3,2,8,1.5,4,13,2,3];for(let i=0;i<24;i++){const radius=35+i*18;g.beginPath();g.arc(0,0,radius,0,2*pi);g.strokeStyle='#151515';g.lineWidth=widths[i%widths.length];g.stroke()}for(let band=0;band<6;band++){const radius=70+band*71;const count=24+band*12;for(let i=0;i<count;i++){const a=i*2*pi/count;g.beginPath();g.arc(0,0,radius,a,a+.025+(band%3)*.012);g.strokeStyle=band%3===2?'#333':'#111';g.lineWidth=band%2===0?2.5:6;g.stroke()}}}else if(type==='rings'){for(let i=0;i<14;i++){g.beginPath();g.arc(0,0,28+i*32,0,2*pi);g.strokeStyle=colors[i%5];g.lineWidth=4+i%3;g.stroke()}}else if(type==='spiral'){for(let arm=0;arm<4;arm++){g.beginPath();for(let t=0;t<=850;t++){const r=8+t*.54,a=t*.043+arm*pi/2;if(t===0)g.moveTo(r*Math.cos(a),r*Math.sin(a));else g.lineTo(r*Math.cos(a),r*Math.sin(a))}g.strokeStyle=colors[arm];g.lineWidth=7;g.stroke()}}else if(type==='dashes'){for(let ring=0;ring<9;ring++
