<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水小偷俱樂部 V13｜全新人形模型驗收</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:#171e24;color:#f4f5f1;overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.panel{position:fixed;left:16px;top:16px;z-index:5;max-width:min(430px,calc(100vw - 32px));padding:18px 20px;background:#101b23d9;border:1px solid #ffffff24;border-radius:19px;backdrop-filter:blur(16px);box-shadow:0 16px 55px #0006}
.eyebrow{color:#ffcc8b;font-size:12px;font-weight:700;letter-spacing:.17em}h1{font-size:23px;margin:5px 0 8px;line-height:1.3}p{margin:0;font-size:13px;color:#bdccd3;line-height:1.7}.pill{display:inline-block;background:#ffffff12;border:1px solid #ffffff2b;border-radius:99px;padding:4px 9px;font-size:11px;color:#dcf2ed;margin:8px 5px 0 0}
.controls{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:9px;flex-wrap:wrap;justify-content:center;z-index:5;width:min(680px,calc(100vw - 20px))}
button,a.btn{font:600 13px system-ui;border-radius:13px;padding:12px 16px;border:1px solid #ffffff2a;background:#202f37dd;color:#fff;cursor:pointer;box-shadow:0 6px 24px #0003;text-decoration:none;white-space:nowrap}
button.active{background:#ffe0ac;color:#302822;border-color:#ffe0ac}button:focus-visible,a:focus-visible{outline:3px solid #f7cf91}
.names{position:fixed;bottom:115px;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none;font-weight:750;text-shadow:0 2px 10px #1119;font-size:16px}
.names small{display:block;font-weight:500;font-size:12px;color:#d5e6e6;margin-top:4px}
#err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,90%);background:#452c34;padding:24px;border-radius:18px;display:none;z-index:10}
@media(max-width:680px){.panel{top:10px;left:10px;right:10px;max-width:none;padding:12px 15px}h1{font-size:18px}.panel p{font-size:11px}.pill{font-size:10px}.names{bottom:150px;font-size:13px}.controls{gap:6px;bottom:calc(9px + env(safe-area-inset-bottom))}button,a.btn{padding:11px 12px;font-size:12px}}
</style></head><body>
<canvas id="view" aria-label="兩位新的三維角色，拖曳旋轉，切換動畫"></canvas>
<div class="panel"><div class="eyebrow">CHARACTER LAB / V13</div><h1>告別米其林寶寶</h1><p>重建身體輪廓：肩膀、腰線、脖子、衣服、手肘、膝蓋與鞋子。這是兩款全新角色的獨立驗收頁，尚未替換主遊戲。</p><span class="pill">4 頭身</span><span class="pill">連續肢體輪廓</span><span class="pill">可動作</span><span class="pill">可拖曳轉角度</span></div>
<div class="names"><div>阿修<small>襯衫＋針織背心</small></div><div>小羽<small>短外套＋俐落褲裝</small></div></div>
<div class="controls"><button data-mode="idle" class="active">站姿</button><button data-mode="walk">走路</button><button data-mode="run">跑步</button><button id="turn">停止自轉</button><button id="front">正面</button><a class="btn" href="./">回主遊戲</a></div>
<div id="err" role="alert"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const cvs=document.getElementById('view'),scene=new THREE.Scene();
scene.background=new THREE.Color('#b8d3d0');scene.fog=new THREE.Fog('#b8d3d0',14,32);
const camera=new THREE.PerspectiveCamera(35,1,.1,70),renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;
scene.add(new THREE.HemisphereLight('#f0fbff','#61717a',2.1));
const key=new THREE.DirectionalLight('#fff4df',3.0);key.position.set(-5,9,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-9;key.shadow.camera.right=9;key.shadow.camera.top=9;key.shadow.camera.bottom=-9;key.shadow.bias=-.00025;scene.add(key);
const rim=new THREE.DirectionalLight('#b8fff1',1.7);rim.position.set(5,4,-7);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:'#e9eee5',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function mat(c,r=.85,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:metal})}
const skin=mat('#f5bb95'),skin2=mat('#eeb08f'),dark=mat('#312d35'),white=mat('#faf8ed'),button=mat('#dcece9'),sole=mat('#eee8db'),shadow=mat('#414a50'),glass=mat('#4b6772');
function sphere(parent,x,y,z,sx,sy,sz,m,seg=24){const a=new THREE.Mesh(new THREE.SphereGeometry(1,seg,16),m);a.position.set(x,y,z);a.scale.set(sx,sy,sz);a.castShadow=true;parent.add(a);return a}
function line(parent,a,b,r1,r2,m,segments=12){const dy=new THREE.Vector3().subVectors(new THREE.Vector3(...b),new THREE.Vector3(...a));const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,dy.length(),segments),m);mesh.position.copy(new THREE.Vector3(...a).add(new THREE.Vector3(...b)).multiplyScalar(.5));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dy.normalize());mesh.castShadow=true;parent.add(mesh);return mesh}
function shapeLoft(parent,rings,m,N=20){
 const v=[],idx=[];for(let j=0;j<rings.length;j++){const [y,x,z,rx,rz]=rings[j];for(let i=0;i<N;i++){const a=2*Math.PI*i/N;v.push(x+Math.cos(a)*rx,y,z+Math.sin(a)*rz)}}
 for(let j=0;j<rings.length-1;j++)for(let i=0;i<N;i++){const a=j*N+i,b=j*N+(i+1)%N,c=(j+1)*N+i,d=(j+1)*N+(i+1)%N;idx.push(a,c,b,b,c,d)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));geo.setIndex(idx);geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,m);mesh.castShadow=true;parent.add(mesh);return mesh
}
function hairCap(head,m,female){
 shapeLoft(head,[ [.09,0,-.02,.44,.34],[.22,0,-.02,.47,.34],[.39,0,-.01,.44,.31],[.49,0,-.01,.34,.24],[.53,0,0,.12,.08]],m,28);
 // Shaped fringe rather than a row of spheres.
 for(const [x,y,z,rx,ry] of (female?[[-.25,.18,.26,.18,.16],[.02,.24,.31,.21,.13],[.26,.20,.25,.13,.17]]:[[-.26,.24,.29,.15,.12],[-.09,.19,.34,.22,.15],[.18,.25,.30,.20,.14]])){
  const lock=sphere(head,x,y,z,rx,ry,.085,m,16);lock.rotation.z=.2*Math.sign(x)
 }
 if(female){
  // One flowing sheet of hair per side, no beads / segmented Michelin loops.
  for(const sg of [-1,1]){
   shapeLoft(head,[[-.34,sg*.37,-.06,.085,.16],[-.17,sg*.40,-.08,.115,.17],[.13,sg*.41,-.05,.14,.17],[.31,sg*.36,-.05,.095,.15]],m,12);
  }
 }else{const swoop=sphere(head,.2,.42,.04,.26,.07,.25,m);swoop.rotation.z=-.27}
}
function person(name,female,x){
 const skinM=female?skin:skin2;
 const cloth=female?mat('#6c9b99'):mat('#e3d1ab'),outer=female?mat('#d8ede3'):mat('#617f91');
 const trousers=female?mat('#465c68'):mat('#4d626e'),shoes=female?mat('#e9e4d9'):mat('#5c5550');
 const hair=female?mat('#513b39'):mat('#31323d');const root=new THREE.Group();root.position.x=x;scene.add(root);
 const torso=new THREE.Group();root.add(torso);
 // anatomical torso: shoulders ~0.8, waist 0.53; NO bead-shaped body.
 shapeLoft(torso,[[1.10,0,0,.29,.18],[1.30,0,0,.31,.20],[1.63,0,0,.40,.225],[1.78,0,0,.34,.19],[1.81,0,0,.24,.15]],cloth,28);
 // Layered outer jacket / vest with tapered waist.
 if(female){
  shapeLoft(torso,[[1.22,0,-.04,.31,.20],[1.44,0,-.04,.35,.225],[1.75,0,-.04,.405,.235]],outer,28);
  const scarf=sphere(torso,0,1.71,.21,.17,.10,.035,white);scarf.rotation.z=-.25;
 }else{
  shapeLoft(torso,[[1.26,0,.035,.305,.19],[1.52,0,.035,.34,.215],[1.75,0,.035,.365,.22]],outer,28);
  const neckTie=shapeLoft(torso,[[1.47,0,.246,.040,.015],[1.64,0,.246,.048,.015],[1.71,0,.245,.024,.01]],mat('#c87963'),8);
  const collarL=sphere(torso,-.10,1.72,.19,.13,.025,.07,white);collarL.rotation.z=-.48;
  const collarR=sphere(torso,.10,1.72,.19,.13,.025,.07,white);collarR.rotation.z=.48;
 }
 for(const yy of [1.36,1.48,1.60])sphere(torso,.02,yy,.245,.013,.013,.011,button,12);
 // Neck is visible and makes head feel attached rather than floating.
 shapeLoft(torso,[[1.76,0,0,.115,.105],[1.95,0,0,.11,.105]],skinM,20);
 const head=new THREE.Group();head.position.y=2.12;torso.add(head);
 const face=sphere(head,0,0,0,.43,.49,.36,skinM,32);face.scale.z=.89;
 sphere(head,0,-.29,.24,.25,.13,.14,skinM);
 hairCap(head,hair,female);
 for(const sg of [-1,1]){
  sphere(head,sg*.185,-.02,.325,.062,.079,.022,dark,20);
  sphere(head,sg*.173,.013,.347,.018,.023,.009,white,12);
  const brow=sphere(head,sg*.185,.135,.33,.11,.019,.018,hair,12);brow.rotation.z=sg*(female?-.07:.05);
  sphere(head,sg*.35,-.135,.12,.068,.043,.027,mat('#eca3a0'),16);
  sphere(head,sg*.425,-.12,-.03,.070,.105,.04,skinM,16);
 }
 const smile=new THREE.Mesh(new THREE.TorusGeometry(.082,.012,5,18,Math.PI),mat('#89534c'));smile.position.set(0,-.195,.333);smile.rotation.z=Math.PI;head.add(smile);
 // Independent limb roots allow natural swing: each arm is one tapered mesh, not stacked spheres.
 const arms=[],legs=[];
 for(const sg of [-1,1]){
  const arm=new THREE.Group();arm.position.set(sg*.38,1.68,0);torso.add(arm);
  shapeLoft(arm,[[ -.50,sg*.055,.035,.078,.090],[-.31,sg*.082,.028,.090,.106],[-.18,sg*.055,.007,.112,.118],[0,0,0,.15,.15]],female?outer:cloth,14);
  sphere(arm,sg*.055,-.54,.047,.078,.125,.082,skinM);
  // tiny wrist cuff with flat band.
  shapeLoft(arm,[[-.49,sg*.06,.035,.086,.09],[-.44,sg*.065,.04,.093,.094]],white,14);
  arms.push(arm);
  const leg=new THREE.Group();leg.position.set(sg*.17,1.12,0);root.add(leg);
  shapeLoft(leg,[[-.84,sg*.018,0,.107,.12],[-.56,sg*.02,.005,.11,.12],[-.32,sg*.015,0,.132,.137],[-.02,0,0,.148,.153]],trousers,18);
  // Distinct shoes with toe-box, heel and thin outsole.
  const foot=new THREE.Group();leg.add(foot);foot.position.set(sg*.018,-.865,.075);
  sphere(foot,0,0,.070,.145,.095,.255,shoes,24);
  sphere(foot,0,-.072,.074,.147,.026,.26,sole,24);
  legs.push(leg)
 }
 const collar=sphere(torso,0,1.80,0,.21,.064,.16,white);
 return {root,torso,head,arms,legs,baseX:x};
}
const characters=[person('阿修',false,-1.35),person('小羽',true,1.35)];
// Podiums are visual only, so the preview is a true character-focused art review.
for(const x of [-1.35,1.35]){
 const pad=new THREE.Mesh(new THREE.CylinderGeometry(.86,.92,.09,48),mat('#c3d0c9'));pad.position.set(x,-.07,0);pad.receiveShadow=true;scene.add(pad);
 const line=new THREE.Mesh(new THREE.TorusGeometry(.82,.017,6,64),mat('#fff6dc',.3));line.rotation.x=Math.PI/2;line.position.set(x,-.016,0);scene.add(line);
}
let mode='idle',turn=true,yaw=0,drag=false,lastX=0;
function setMode(m){mode=m;document.querySelectorAll('button[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m))}
document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('turn').addEventListener('click',e=>{turn=!turn;e.currentTarget.textContent=turn?'停止自轉':'自動旋轉'});
document.getElementById('front').addEventListener('click',()=>{yaw=0;turn=false;document.getElementById('turn').textContent='自動旋轉'});
cvs.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.008;lastX=e.clientX}});
cvs.addEventListener('pointerup',()=>drag=false);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<680?42:34;camera.updateProjectionMatrix();const d=w<680?9.1:8.2;camera.position.set(0,2.5,d);camera.lookAt(0,1.26,0)}
window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function frame(){
 requestAnimationFrame(frame);const t=clock.getElapsedTime();if(turn)yaw+=.0025;
 for(let n=0;n<characters.length;n++){
  const c=characters[n],speed=mode==='run'?10:6,amp=mode==='idle'?.035:mode==='run'?.48:.31;
  c.root.rotation.y=yaw+(n===0?-.12:.12);
  c.torso.position.y=Math.sin(t*(mode==='idle'?2.4:speed*2))*(mode==='idle'?.018:mode==='walk'?.034:.067);
  c.torso.rotation.z=Math.sin(t*(mode==='idle'?1.5:speed))*.012;
  c.head.rotation.z=Math.sin(t*1.1+n)*.022;
  c.head.rotation.x=Math.sin(t*.9+n)*.018;
  c.arms.forEach((a,i)=>{a.rotation.x=(i===0?1:-1)*Math.sin(t*speed+n)*amp*(mode==='idle'?.35:1);a.rotation.z=(i===0?.055:-.055)});
  c.legs.forEach((l,i)=>{l.rotation.x=(i===0?-1:1)*Math.sin(t*speed+n)*amp*.72});
 }
 renderer.render(scene,camera)
}
frame();
window.addEventListener('error',e=>{const el=document.getElementById('err');el.style.display='block';el.textContent='預覽載入失敗：'+e.message});
</script></body></html>
