<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V16 角色選拔｜薪水小偷俱樂部</title><style>
*{box-sizing:border-box}body{margin:0;background:#c6dcd5;color:#eff9f1;font-family:system-ui,"Noto Sans TC",sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:4;padding:13px 15px;border-radius:16px;background:#142925e6;max-width:305px}.top small{color:#f2d59f;letter-spacing:.13em;font-weight:800}.top h1{font-size:19px;margin:6px 0}.top p{font-size:11px;color:#c9ddd5;line-height:1.6;margin:0}.back{position:fixed;right:12px;top:calc(15px + env(safe-area-inset-top));z-index:4;color:#fff;text-decoration:none;background:#183b33;padding:10px;border-radius:10px;font-size:12px}.dock{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:3;max-width:660px;margin:auto;border-radius:17px;background:#172d28ec;padding:12px;border:1px solid #ffffff38;display:grid;gap:9px}.group{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}button{font-weight:700;cursor:pointer;border:1px solid #658e81;background:#31574b;color:#fff;border-radius:10px;padding:11px;font-size:12px;min-height:42px}button.on{background:#f4dbb6;color:#263b36;border-color:#f4dbb6}button:disabled{opacity:.4}.info{text-align:center;font-size:10px;color:#cbdad5;margin:0}#message{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);background:#18382fe8;padding:14px;border-radius:12px;min-width:240px;text-align:center;font-size:12px;z-index:6;line-height:1.8}#message[hidden]{display:none}.credit{position:fixed;right:12px;bottom:190px;color:#2e5750;font-size:10px;text-align:right;z-index:2}@media(max-width:520px){.top{max-width:225px;padding:11px}.top h1{font-size:16px}.top p{font-size:10px}button{font-size:11px;padding:9px}.dock{padding:9px}.credit{bottom:180px}}
</style></head><body>
<canvas id="stage"></canvas><div class="top"><small>V16 / ASSET COMPARISON</small><h1>角色正式選拔</h1><p>實際載入專業製作的 CC0 GLB 人物，不再以球體拼接。四套角色可旋轉、比較與檢視原生動畫。主遊戲尚未替換。</p></div><a class="back" href="./">主遊戲</a>
<div class="credit">角色模型 © Quaternius · CC0<br>公開檔案由 jsDelivr / GitHub 載入</div><div id="message">載入 Three.js 與模型中…</div>
<div class="dock"><div class="group"><button data-p="0" class="on">女 · 休閒</button><button data-p="1">女 · 正式</button><button data-p="2">男 · 休閒</button><button data-p="3">男 · 西裝</button></div><div class="group"><button data-a="idle" class="on">站姿</button><button data-a="walk">走路</button><button data-a="run">跑步</button><button id="spin">自動旋轉</button><button id="front">看正面</button></div><p class="info">拖曳旋轉 · 滑鼠滾輪縮放 · 僅有模型內建動畫時才能切換動作</p></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
const paths=['modular_women/Casual.glb','modular_women/Formal.glb','modular_men/Casual.glb','modular_men/Suit.glb'];
const cdn='https://cdn.jsdelivr.net/gh/trebeljahr/quaternius-showcase@main/public/glb/';
const raw='https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/main/public/glb/';
const canvas=document.getElementById('stage'),notice=document.getElementById('message');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#c6dcd5');
const camera=new THREE.PerspectiveCamera(36,1,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x849f96,2));
const sun=new THREE.DirectionalLight(0xffefd7,2.8);sun.position.set(-4,7,6);sun.castShadow=true;sun.shadow.camera.left=-5;sun.shadow.camera.right=5;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-5;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshStandardMaterial({color:'#edece4',roughness:.94}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const platform=new THREE.Mesh(new THREE.CylinderGeometry(.95,1.03,.1,48),new THREE.MeshStandardMaterial({color:'#9bbcb0',roughness:.9}));platform.position.y=.01;platform.receiveShadow=true;scene.add(platform);
const rim=new THREE.DirectionalLight(0xd1f3e7,1);rim.position.set(4,5,-5);scene.add(rim);
const loader=new GLTFLoader();let model=null,mixer=null,clips=[],chosen=0,action='idle',turn=false,yaw=0,dist=6,seq=0,pointer=null,lastX=0;
function cameraMove(){camera.position.set(Math.sin(yaw)*dist,2.4,Math.cos(yaw)*dist);camera.lookAt(0,1.45,0)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?44:36;camera.updateProjectionMatrix();cameraMove()}addEventListener('resize',resize);resize();
function findClip(a){const r={idle:/idle|stand|wait|breath/i,walk:/walk|locomot/i,run:/run|sprint|jog/i}[a];return clips.find(c=>r.test(c.name))}
function animateAction(a){action=a;document.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('on',b.dataset.a===a));if(!mixer)return;mixer.stopAllAction();const clip=findClip(a);if(clip)mixer.clipAction(clip).reset().play();document.querySelectorAll('[data-a]').forEach(b=>{b.disabled=b.dataset.a!=='idle'&&!findClip(b.dataset.a)})}
function fetchAsset(url){return new Promise((res,rej)=>loader.load(url,res,undefined,rej))}
async function show(i){chosen=i;const ticket=++seq;notice.hidden=false;notice.textContent='載入角色 '+(i+1)+'/4 …';document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p===i));
 try{let g;try{g=await fetchAsset(cdn+paths[i])}catch(e){g=await fetchAsset(raw+paths[i])}if(ticket!==seq)return;
 if(model){scene.remove(model);mixer?.stopAllAction();model=null;mixer=null}model=new THREE.Group();scene.add(model);
 const object=g.scene;object.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});object.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(object),size=bounds.getSize(new THREE.Vector3());if(size.y<.02)throw Error('Invalid GLB bounds');const scale=2.9/size.y;object.scale.multiplyScalar(scale);object.updateMatrixWorld(true);
 const b=new THREE.Box3().setFromObject(object),center=b.getCenter(new THREE.Vector3());object.position.set(-center.x,.1-b.min.y,-center.z);model.add(object);
 clips=g.animations||[];mixer=new THREE.AnimationMixer(object);animateAction(action);
 notice.textContent='載入成功 · '+clips.length+' 個原始動畫';setTimeout(()=>{if(ticket===seq)notice.hidden=true},1300);
 }catch(e){if(ticket===seq){notice.hidden=false;notice.textContent='模型載入失敗：'+(e.message||e)+'。請換模型或重新整理。'}}}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>show(+b.dataset.p));
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>animateAction(b.dataset.a));
document.getElementById('spin').onclick=e=>{turn=!turn;e.currentTarget.classList.toggle('on',turn)};
document.getElementById('front').onclick=()=>{yaw=0;turn=false;document.getElementById('spin').classList.remove('on');cameraMove()};
canvas.addEventListener('pointerdown',e=>{pointer=e.pointerId;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(pointer===e.pointerId){yaw+=(lastX-e.clientX)*.008;lastX=e.clientX;cameraMove()}});
canvas.addEventListener('pointerup',()=>pointer=null);
canvas.addEventListener('pointercancel',()=>pointer=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3.6,Math.min(10,dist+e.deltaY*.008));cameraMove()},{passive:false});
addEventListener('error',e=>{notice.hidden=false;notice.textContent='載入錯誤：'+e.message});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);if(turn){yaw+=dt*.45;cameraMove()}renderer.render(scene,camera)}frame();show(0);
</script></body></html>
