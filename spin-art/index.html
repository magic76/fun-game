<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轉盤畫室 · Spin Art</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e8;color:#26253a;font-family:system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}h1{margin:0;font-size:clamp(28px,5vw,42px)}p{color:#646275}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:20px}.stage{display:grid;place-items:center;aspect-ratio:1;background:#e9e1d6;border-radius:24px;touch-action:none;overflow:hidden} .stage{position:relative;container-type:size;align-self:start;width:100%}.turn-stick{position:absolute;bottom:12px;width:48px;height:86px;border:1px solid #a99cce;background:#fffdf3e8;border-radius:24px;z-index:3;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:ns-resize;box-shadow:0 3px 12px #0002;user-select:none}.turn-stick.left{left:10px}.turn-stick.right{right:10px}.turn-stick .track{height:55px;width:7px;background:#d7cfee;border-radius:6px;position:relative}.turn-stick .knob{position:absolute;top:50%;left:50%;width:31px;height:19px;border-radius:12px;background:#7362cc;box-shadow:0 2px 6px #0003;transform:translate(-50%,-50%)}.turn-stick:active .knob{background:#49399b}.turn-stick[hidden]{display:none!important}.rim-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#22223b;border:3px solid white;box-shadow:0 1px 5px #0005;pointer-events:none;z-index:2;transform:translate(-50%,-50%)}canvas{position:absolute;inset:0;margin:auto;width:min(92cqw,92cqh);height:min(92cqw,92cqh);border-radius:50%;background:white;touch-action:none;box-shadow:0 12px 30px #0002;cursor:crosshair}.panel{background:white;padding:20px;border-radius:22px;display:flex;flex-direction:column;gap:15px;box-shadow:0 8px 24px #0001}label{display:flex;flex-direction:column;gap:7px;font-weight:650}input[type=range]{width:100%;accent-color:#7362cc}input[type=color lor input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.custom-color:focus-within{outline:3px solid #7362cc;outline-offset:1px}.hint{font-size:14px;line-height:1.6;margin:0}.quickbar{display:flex;gap:6px}.quickbar button{min-width:0;font-size:12px;padding:10px 7px}.quickbar #toggleTools{flex:2}.tool-body{display:flex;flex-direction:column;gap:15px}.panel:has(.tool-body:not(.open)) .tool-body{display:none}.example-options.expanded{grid-template-columns:repeat(3,minmax(0,1fr))}.frame-note{font-size:11px;color:#646275}footer{font-size:13px;color:#777;text-align:center;margin-top:22px}@media(max-width:720px){.layout{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:16px}}@media(max-width:720px){html,body{height:100%;overflow:hidden}.wrap{height:100dvh;display:flex;flex-direction:column;padding:8px 12px;gap:5px}.wrap>h1{font-size:20px;line-height:1.1}.wrap>p{display:none}.layout{display:flex;flex-direction:column;flex:1;min-height:0;margin:0;gap:8px}.stage{flex:1;min-height:0;aspect-ratio:auto;border-radius:14px}.panel{flex:none;display:block;padding:8px;border-radius:14px;box-shadow:none}.tool-body{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:48dvh;overflow:auto;overscroll-behavior:contain;margin-top:7px}.tool-body:not(.open){display:none}.quickbar button{font-size:12px;padding:9px 4px}.panel>label:first-child{display:none}.tool-body>.buttons:first-of-type{grid-column:1/-1}.panel label{font-size:12px;gap:2px}.panel button{font-size:12px;min-width:0;padding:9px 5px;border-radius:9px}.panel .buttons{gap:5px}.tool-body #autoControls,.tool-body #manualControls{grid-column:1/-1}.panel #autoControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}.panel #manualControls:not([hidden]){display:block}.panel #manualControls .hint{display:block;font-size:11px;line-height:1.25;margin:2px 0}.panel #autoControls .buttons{align-self:end}.panel #autoControls label{min-width:0}.panel #hint{display:none}.tool-body> ss="buttons"><button id="cw" aria-pressed="true">↻ 順時針</button><button id="ccw" class="secondary" aria-pressed="false">↺ 逆時針</button></div></div><div id="manualControls" hidden><p class="hint">拖曳圓盤左下或右下的紫色搖桿，上下移動旋轉；圓盤內側直接畫畫。</p></div><div class="examples"><div class="examples-header"><span class="examples-title">圖案範例 <span id="exampleCount">48 種</span></span><button type="button" id="toggleExamples" class="secondary" aria-expanded="false" aria-controls="exampleOptions">展開全部 ▾</button></div><div class="example-options" id="exampleOptions"><button type="button" data-technique="benham">🌈 黑白幻彩</button><button type="button" data-technique="benham-shift">◐ 幻彩・錯位弧</button><button type="button" data-technique="benham-hub">◐ 幻彩・黑心細弧</button><button type="button" data-technique="benham-five">◐ 幻彩・五線弧</button><button type="button" data-technique="checker">▦ 棋盤漩渦</button><button type="button" data-technique="artist">◎ 粗細線光學</button><button type="button" data-technique="hand-original">🎨 手繪原型</button><button type="button" data-technique="hand-offset">🎨 錯位節奏</button><button type="button" data-technique="hand-wild">🎨 不規則爆發</button><button type="button" data-technique="walker-tunnel">🚶 無限隧道</button><button type="button" data-technique="asym-hook">↝ 偏心鉤旋</button><button type="button" data-technique="asym-crescent">↝ 月牙落穴</button><button type="button" data-technique="asym-sweep">↝ 單側掃線</button><button type="button" data-technique="asym-stair">↝ 斜坡深井</button><button type="button" data-technique="asym-comet">↝ 彗星拖尾</button><button type="button" data-technique="asym-vortex">↝ 偏軸漩渦</button><button type="button" data-technique="asym-ribbon">↝ 飄帶墜落</button><button type="button" data-technique="asym-fall">↝ 落石隧道</button><button type="button" data-technique="asym-wave">↝ 半面波浪</button><button type="button" data-technique="asym-zipper">↝ 拉鍊裂縫</button><button type="button" data-technique="asym-brush">↝ 墨刷旋流</button><button type="button" data-technique="asym-chase">↝ 追逐軌跡</button><button type="button" data-technique="artist-1">◎ 光學・密集螺旋</button><button type="button" data-technique="artist-2">◎ 光學・雙粗紅線</button><button type="button" data-technique="artist-3">◎ 光學・細鋸齒</button><button type="button" data-technique="artist-4">◎ 光學・短筆密排</button><button type="button" data-technique="artist-5">◎ 光學・寬窄交錯</button><button type="button" data-technique="artist-6">◎ 光學・漩渦加密</button><button type="button" data-technique="artist-7">◎ 光學・雙層短筆</button><button type="button" data-technique="artist-8">◎ 光學・細筆節奏</button><button type="button" data-technique="artist-9">◎ 光學・粗線強化</button><button type="button" data-technique="artist-10">◎ 光學・滿版密線</button><button type="button" data-technique="line-tide">三瓣潮紋</button><button type="button" data-technique="line-feather">羽扇細梳</button><button type="button" data-technique="line-broken">錯位斷環</button><button type="button" data-technique="line-braid">交織雙索</button><button type="button" data-technique="line-shell">貝殼扇紋</button><button type="button" data-technique="line-moire">三心波紋</button><button type="button" data-technique="line-lantern">燈籠雙瓣</button><button type="button" data-technique="line-steps">六角階梯</button><button type="button" data-technique="line-comet">彗尾點鏈</button><button type="button" data-technique="line-scales">扇形魚鱗</button><button type="button" data-technique="rings">◎ 同心圓</button><button type="button" data-technique="spiral">🌀 螺旋</button><button type="button" data-technique="dashes">✳ 放射短線</button><button type="button" data-technique="waves">〰 波浪環</button><button type="button" data-technique="petals">🌸 花瓣環</button><button type="button" data-technique="orbit">◉ 軌道線</button></div></div><div class="palette-group"><div class="palette-title">畫筆顏色</div><div id="palette" class="palette" role="group" aria-label="快速選擇畫筆顏色"><button type="button" class="swatch" style="--swatch:#22223b;--check:#ffffff" data-color="#22223b" aria-label="深色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ffffff;--check:#22223b" data-color="#ffffff" aria-label="白色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ef4444;--check:#ffffff" data-color="#ef4444" aria-label="紅色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#f97316;--check:#ffffff" data-color="#f97316" aria-label="橘色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#facc15;--check:#22223b" data-color="#facc15" aria-label="黃色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#22c55e;--check:#ffffff" data-color="#22c55e" aria-label="綠色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#06b6d4;--check:#ffffff" data-color="#06b6d4" aria-label="青色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#3b82f6;--check:#ffffff" data-color="#3b82f6" aria-label="藍色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#8b5cf6;--check:#ffffff" data-color="#8b5cf6" aria-label="紫色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#ec4899;--check:#ffffff" data-color="#ec4899" aria-label="粉紅" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#a16207;--check:#ffffff" data-color="#a16207" aria-label="棕色" aria-pressed="false"></button><button type="button" class="swatch" style="--swatch:#f16a70;--check:#ffffff" data-color="#f16a70" aria-label="珊瑚紅" aria-pressed="true"></button><label class="custom-color" aria-label="自訂畫筆顏色">＋<input id="color" type="color" value="#f16a70" aria-label="開啟自訂顏色選擇器"></label></div></div><label>畫筆粗細 <span id="sizeValue">18 px</span><input id="size" type="range" min="1" max="70" value="18"></label><p class="hint" id="hint">手指按住不動會畫出圓弧；慢慢往中心移動，試試螺旋。</p><div class="buttons"><button id="undo" class="secondary" disabled>↶ 復原</button><button id="clear" class="secondary">清空畫布</button><button id="save">下載 PNG</button><button id="share">分享作品</button></div></div></section></div><footer>作品僅保存在此頁，離開前記得下載。</footer></main><script>(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#art'),ctx=c.getContext('2d'),off=document.createElement('canvas');off.width=off.height=1000;const g=off.getContext('2d');let mode='auto',dir=1,angle=0,last=performance.now();const pointers=new Map(),history=[];const MAX_UNDO=12;function saveHistory(){if(history.length===MAX_UNDO)history.shift();history.push(g.getImageData(0,0,1000,1000));$('#undo').disabled=false}function undo(){if(!history.length)return;pointers.clear();g.putImageData(history.pop(),0,0);$('#undo').disabled=!history.length}function clear(){g.clearRect(0,0,1000,1000);g.fillStyle='#fff';g.beginPath();g.arc(500,500,500,0,Math.PI*2);g.fill()}clear();function screen(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*1000-500,y:(e.clientY-b.top)/b.height*1000-500}}function local(p){const co=Math.cos(-angle),si=Math.sin(-angle);return{x:500+p.x*co-p.y*si,y:500+p.x*si+p.y*co}}function stroke(a,b){g.save();g.beginPath();g.arc(500,500,500,0,Math.PI*2);g.clip();g.strokeStyle=$('#color').value;g.lineWidth=+$('#size').value;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore()}function polar(p){return Math.atan2(p.y,p.x)}function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(mode==='auto')angle+=dir*(+$('#speed').value)*Math.PI/180*dt;for(const active of pointers.values()){if(active.kind==='draw'){const next=local(active.screen);stroke(active.point,next);active.point=next}}ctx.clearRect(0,0,1000,1000);ctx.save();ctx.translate(500,500);ctx.rotate(angle);ctx.drawImage(off,-500,-500);ctx.restore();const rect=c.getBoundingClientRect(),stageRect=c.parentElement.getBoundingClientRect(),radius=rect.width/2+10,dot=$('#rimDot');dot.style.left=(rect.left-stageRect.left+rect.width/2+Math.sin(angle)*radius)+'px';dot.style.top=(rect.top-stageRect.top+rect.height/2-Math.cos(angle)*radius)+'px';requestAnimationFrame(frame)}function setPressed(id,yes){$(id).setAttribute('aria-pressed',String(yes));$(id).classList.toggle('secondary',!yes)}function setMode(m){mode=m;pointers.clear();setPressed('#auto',m==='auto');setPressed('#manual',m==='manual');$('#autoControls').hidden=m!=='auto';$('#manualControls').hidden=m!=='manual';$('#stickLeft').hidden=m!=='manual';$('#stickRight').hidden=m!=='manual';$('#hint').textContent=m==='auto'?'手指按住不動會畫出圓弧；慢慢往中心移動，試試螺旋。':'拖曳左下或右下紫色搖桿旋轉，盤面直接畫畫。'}c.addEventListener('pointerdown',e=>{const p=screen(e);if(Math.hypot(p.x,p.y)>500)return;e.preventDefault();c.setPointerCapture(e.pointerId);if(pointers.size===0)saveHistory();const point=local(p);pointers.set(e.pointerId,{kind:'draw',point,screen:p});stroke(point,point)});c.addEventListener('pointermove',e=>{const active=pointers.get(e.pointerId);if(!active)return;e.preventDefault();const p=screen(e);const next=local(p);stroke(active.point,next);active.point=next;active.screen=p});function stop(e){pointers.delete(e.pointerId)}['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,stop));for(const stick of [$('#stickLeft'),$('#stickRight')]){const knob=stick.querySelector('.knob');const held=new Map();function update(){let offset=0;for(const v of held.values())offset+=v;offset=Math.max(-24,Math.min(24,offset));knob.style.top=(50+offset/24*30)+'%';stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))}stick.addEventListener('pointerdown',e=>{if(mode!=='manual')return;e.preventDefault();stick.setPointerCapture(e.pointerId);held.set(e.pointerId,e.clientY);update()});stick.addEventListener('pointermove',e=>{if(!held.has(e.pointerId))return;e.preventDefault();const previous=held.get(e.pointerId);angle+=(previous-e.clientY)*Math.PI/180;held.set(e.pointerId,e.clientY);const shift=Math.max(-24,Math.min(24,(previous-e.clientY)*2));knob.style.top=(50-shift/24*30)+'%';stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))});for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{held.delete(e.pointerId);knob.style.top='50%'});stick.addEventListener('keydown',e=>{if(mode!=='manual')return;if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();angle+=(e.key==='ArrowUp'?1:-1)*Math.PI/18;stick.setAttribute('aria-valuenow',String(Math.round(angle*180/Math.PI)%360))}})}$('#auto').onclick=()=>setMode('auto');$('#manual').onclick=()=>setMode('manual');$('#cw').onclick=()=>{dir=1;setPressed('#cw',true);setPressed('#ccw',false)};$('#ccw').onclick=()=>{dir=-1;setPressed('#cw',false);setPressed('#ccw',true)};$('#speed').oninput=()=>$('#speedValue').textContent=$('#speed').value+'°/秒';function syncPalette(){const value=$('#color').value.toLowerCase();document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===value)));$('.custom-color').style.background=value;$('.custom-color').style.color=['#ffffff','#facc15'].includes(value)?'#22223b':'#ffffff'}document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{$('#color').value=b.dataset.color;syncPalette()}));$('#color').addEventListener('input',syncPalette);syncPalette();$('#size').oninput=()=>$('#sizeValue').textContent=$('#size').value+' px';
// All preset coordinates are local to the stationary backing canvas.
function drawRim(radius, width) {
  g.beginPath();
  g.arc(0, 0, radius - width / 2, 0, 2 * Math.PI);
  g.lineWidth = width;
  g.strokeStyle = '#000';
  g.stroke();
}

function drawBenham(type) {
  // Nishiyama, Fig. 1: four 45-degree sectors, three concentric arcs per sector.
  const radius = 498;
  const sector = Math.PI / 4;
  const hub = type === 'benham-hub';
  if (hub) g.rotate(-Math.PI / 2);
  g.fillStyle = '#000';
  g.beginPath();
  g.arc(0, 0, radius, 0, Math.PI);
  g.closePath();
  g.fill();
  drawRim(radius, 0.003 * radius);
  g.lineCap = 'butt';

  function arc(fraction, start, span) {
    g.beginPath();
    g.arc(0, 0, fraction * radius, -start - span, -start);
    g.stroke();
  }

  if (hub) {
    // Exploratorium Science Snackbook, p. 9: black hub and staggered fine arcs.
    g.beginPath();
    g.arc(0, 0, 0.319 * radius, 0, 2 * Math.PI);
    g.fill();
    g.lineWidth = 4.7 / 360 * radius;
    for (const [base, step] of [[182,-7.7], [194,7.7], [297,-7.7], [309,7.7]]) {
      for (let i = 0; i < 7; i++) arc((base + i * step) / 360, i * Math.PI / 9, Math.PI / 3);
    }
    return;
  }

  const five = type === 'benham-five';
  const lines = five ? 5 : 3;
  const groups = five ? 3 : 4;
  g.lineWidth = radius * (five ? 0.023 : 2.44 / 72);
  for (let group = 0; group < groups; group++) {
    let start = group * sector;
    if (type === 'benham-shift') {
      if (group === 0) start += Math.PI / 9;
      if (group === 3) start -= Math.PI / 9;
    }
    for (let line = 0; line < lines; line++) {
      const index = group * lines + line;
      const fraction = five ? 0.22 + 0.05 * index : (19.8 + 4.35 * index) / 72;
      arc(fraction, start, sector);
    }
  }
}

function drawWheelStudy(variant = 0) {
  // Front-facing reconstruction of the finished July 2024 wheel (LimbaTrip).
  // The outer ink occupies about 46% of the white board's radius.
  const red = '#cd6067';
  const blue = '#17285f';
  const scale = 3.25;
  g.scale(scale, scale);
  g.save();
  g.beginPath();
  g.arc(0, 0, 139, 0, 2 * Math.PI);
  g.clip();
  const point = (angle, radius) => [radius * Math.cos(angle), radius * Math.sin(angle)];
  const pitch = (48 + (variant % 4) * 5) / (2 * Math.PI);
  const redRadius = angle => 59 + angle * pitch;
  const start = (-0.75 - (variant % 3) * 0.1) * Math.PI;
  const end = (3.75 + Math.floor(variant / 3) * 0.12) * Math.PI;

  // A broad red spiral carries a thinner zigzag on its inner edge.
  g.lineJoin = 'round';
  g.lineCap = 'round';
  g.strokeStyle = red;
  g.lineWidth = 9 + (variant % 4) * 2;
  g.beginPath();
  for (let i = 0; i <= 450; i++) {
    const angle = start + (end - start) * i / 450;
    const p = point(angle, redRadius(angle));
    if (i === 0) g.moveTo(...p);
    else g.lineTo(...p);
  }
  g.stroke();
  g.lineWidth = 3 + (variant % 3) * 1.4;
  g.beginPath();
  g.moveTo(...point(start, redRadius(start)));
  for (let angle = start; angle < end;) {
    const next = Math.min(end, angle + (0.22 + (variant % 5) * .045));
    const mid = (angle + next) / 2;
    g.lineTo(...point(mid, redRadius(mid) * 0.87));
    g.lineTo(...point(next, redRadius(next)));
    angle = next;
  }
  g.stroke();

  // Short blue chisel marks occupy the white channel between red turns.
  g.fillStyle = blue;
  for (let angle = start - 2 * Math.PI; angle < end; angle += (0.27 + (variant % 4) * .045)) {
    const radius = redRadius(angle) + 18 + (variant % 3) * 3;
    if (radius < 42) continue;
    g.save();
    g.rotate(angle);
    g.translate(radius, 0);
    const width = radius * (0.105 + (variant % 3) * .025);
    const height = radius * (0.13 + (variant % 4) * .02);
    g.beginPath();
    g.roundRect(-width / 2, -height / 2, width, height, width * 0.24);
    g.fill();
    g.restore();
  }
  g.restore();

  g.strokeStyle = blue;
  g.fillStyle = blue;
  g.lineWidth = 8;
  g.beginPath();
  g.arc(0, 0, 28, 0, 2 * Math.PI);
  g.stroke();
  for (let i = 0; i < 14; i++) {
    g.save();
    g.rotate(i * 2 * Math.PI / 14);
    g.beginPath();
    g.roundRect(29, -5, 15, 10, 3);
    g.fill();
    g.restore();
  }
  // Only this small painted ring is eccentric in the reference.
  g.lineWidth = 7;
  g.beginPath();
  g.arc(-10, -10, 10, 0, 2 * Math.PI);
  g.stroke();
}

function drawLineStudy(type) {
  const turn = 2 * Math.PI;
  const ink = '#171717';
  g.strokeStyle = ink;
  g.fillStyle = ink;
  g.lineCap = 'round';

  function curve(width, point, segments = 360) {
    g.lineWidth = width;
    g.beginPath();
    for (let i = 0; i <= segments; i++) {
      const [radius, angle] = point(i / segments);
      const x = radius * Math.cos(angle);
      const y = radius * Math.sin(angle);
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.stroke();
  }

  function repeat(count, draw) {
    for (let i = 0; i < count; i++) {
      g.save();
      g.rotate(turn * i / count);
      draw(i);
      g.restore();
    }
  }

  switch (type) {
    case 'tide': // Nested three-lobed curves with fine companion tracks.
      for (let i = 0; i < 7; i++) {
        for (const [offset, width] of [[0, 13], [15, 3]]) {
          curve(width, t => [80 + i * 50 + offset + 26 * Math.sin(3 * turn * t + i * 0.5), turn * t]);
        }
      }
      break;
    case 'feather':
      repeat(12, () => {
        curve(10, t => [88 + 344 * t, 0.52 * t * t]);
        for (let j = 1; j <= 7; j++) {
          const root = j / 9;
          curve(3 + j * 0.65, t => [88 + 344 * root + 44 * t, 0.52 * root * root - 0.16 * Math.sin(t * 1.45)], 24);
        }
      });
      break;
    case 'broken':
      g.lineCap = 'butt';
      for (let j = 0; j < 7; j++) {
        repeat(6, () => {
          const phase = j * 0.092;
          curve(22, t => [85 + 52 * j, phase + 0.65 * t], 42);
          curve(4, t => [104 + 52 * j, phase + 0.2 + 0.73 * t], 42);
        });
      }
      break;
    case 'braid': // Interrupted underpasses leave a white gap at each crossing.
      for (const [r, width] of [[150, 13], [345, 21]]) {
        const strand = (t, sign) => [r + 45 * Math.sin(5 * turn * t) * sign, turn * t];
        curve(width, t => strand(t, 1));
        curve(width, t => strand(t, -1));
        for (let i = 0; i < 10; i++) {
          const crossing = t => strand(i / 10 + (t - 0.5) * 0.037, i % 2 ? 1 : -1);
          g.strokeStyle = '#fff';
          curve(width + 12, crossing, 20);
          g.strokeStyle = ink;
          curve(width, crossing, 20);
        }
      }
      break;
    case 'shell':
      repeat(5, () => {
        for (let i = 0; i < 8; i++) {
          curve(i === 0 ? 14 : 3, t => [75 + 350 * t, 0.96 * t + i * 0.078 * Math.sin(Math.PI * t)], 100);
        }
      });
      break;
    case 'moire':
      repeat(3, () => {
        g.save();
        g.translate(110, 0);
        for (let i = 0; i < 13; i++) {
          g.lineWidth = i % 4 === 0 ? 8 : 2.5;
          g.beginPath();
          g.arc(0, 0, 60 + 20 * i, 0, turn);
          g.stroke();
        }
        g.restore();
      });
      break;
    case 'lantern':
      repeat(8, () => {
        for (const [offset, width] of [[0, 14], [0.075, 4]]) {
          curve(width, t => [248 + 158 * Math.cos(turn * t), 0.26 * Math.sin(turn * t) + offset]);
        }
      });
      break;
    case 'steps':
      g.lineJoin = 'bevel';
      for (let i = 0; i < 9; i++) {
        const radius = 65 + 40 * i;
        curve(i % 3 ? 4 : 16, t => [radius, t * turn + i * 0.095], 6);
      }
      break;
    case 'comet':
      repeat(7, () => {
        curve(12, t => [100 + 300 * t, 0.89 * t * t], 100);
        curve(3, t => [100 + 300 * t, 0.89 * t * t + 0.075], 100);
        for (let i = 0; i < 6; i++) {
          const t = i / 6;
          const r = 215 + 172 * t;
          const angle = 0.89 * ((r - 100) / 300) ** 2 - 0.15;
          g.beginPath();
          g.arc(r * Math.cos(angle), r * Math.sin(angle), 3 + 8 * t, 0, turn);
          g.fill();
        }
      });
      break;
    case 'scales':
      for (let row = 0; row < 5; row++) {
        repeat(12, () => {
          const phase = row % 2 * turn / 24;
          for (const [offset, width] of [[0, 13], [15, 3]]) {
            curve(width, t => [90 + 65 * row + offset + 41 * Math.sin(Math.PI * t), phase + t * turn / 12], 40);
          }
        });
      }
      break;
  }
}

function loadTechnique(type){saveHistory();pointers.clear();clear();const pi=Math.PI;g.save();g.beginPath();g.arc(500,500,498,0,2*pi);g.clip();g.translate(500,500);g.lineCap='round';g.lineJoin='round';const colors=['#7362cc','#f16a70','#06b6d4','#f59e0b','#22c55e'];if(type.startsWith('benham')){drawBenham(type)}else if(type==='checker'){for(let ring=0;ring<18;ring++){const r=ring*27,n=24+ring*2;for(let i=0;i<n;i++){if((i+ring)%2)continue;g.beginPath();g.arc(0,0,r+25,i*2*pi/n+ring*.025,(i+1)*2*pi/n+ring*.025);g.arc(0,0,r,(i+1)*2*pi/n+ring*.025,i*2*pi/n+ring*.025,true);g.closePath();g.fillStyle='#171717';g.fill()}}}else if(type==='artist'||/^artist-\d+$/.test(type)){drawWheelStudy(type==='artist'?0:Number(type.slice(7)))}else if(type==='walker-tunnel'){drawWalkerTunnel()}else if(type.startsWith('hand-')){drawHandWheel(type.slice(5))}else if(type.startsWith('asym-')){drawAsymmetric(type.slice(5))}else if(type.startsWith('line-')){drawLineStudy(type.slice(5))}else if(type==='rings'){for(let i=0;i<14;i++){g.beginPath();g.arc(0,0,28+i*32,0,2*pi);g.strokeStyle=colors[i%5];g.lineWidth=4+i%3;g.stroke()}}else if(type==='spiral'){for(let arm=0;arm<4;arm++){g.beginPath();for(let t=0;t<=850;t++){const r=8+t*.54,a=t*.043+arm*pi/2;if(t===0)g.moveTo(r*Math.cos(a),r*Math.sin(a));else g.lineTo(r*Math.cos(a),r*Math.sin(a))}g.strokeStyle=colors[arm];g.lineWidth=7;g.stroke()}}else if(type==='dashes'){for(let ring=0;ring<9;ring++){const radius=65+ring*46,count=12+ring*6;for(let i=0;i<count;i++){const a=i*2*pi/count+ring*.09;g.beginPath();g.moveTo(radius*Math.cos(a),radius*Math.sin(a));g.lineTo((radius+18)*Math.cos(a),(radius+18)*Math.sin(a));g.strokeStyle=colors[ring%5];g.lineWidth=5;g.stroke()}}}else if(type==='waves'){for(let ring=0;ring<16;ring++){const radius=35+ring*28;g.beginPath();for(let i=0;i<=720;i++){const a=i*pi/360,r=radius+7*Math.sin(12*a+ring*.8);if(i===0)g.moveTo(r*Math.cos(a),r*Math.sin(a));else g.lineTo(r*Math.cos(a),r*Math.sin(a))}g.closePath();g.strokeStyle=colors[ring%5];g.lineWidth=6;g.stroke()}}else if(type==='petals'){for(let ring=0;ring<6;ring++){const radius=80+ring*68,count=14+ring*3;for(let i=0;i<count;i++){const a=i*2*pi/count+ring*.08;g.save();g.rotate(a);g.translate(radius,0);g.fillStyle=colors[ring%5];g.beginPath();g.ellipse(0,0,24,10,.3,0,2*pi);g.fill();g.restore()}}}else if(type==='orbit'){for(let ring=0;ring<12;ring++){const radius=38+ring*37;g.beginPath();g.arc(0,0,radius,ring*.16,2*pi-ring*.12);g.strokeStyle=colors[ring%5];g.lineWidth=8;g.stroke();for(let j=0;j<4;j++){const a=ring*.16+j*pi/2;g.beginPath();g.arc(radius*Math.cos(a),radius*Math.sin(a),5,0,2*pi);g.fillStyle=colors[(ring+2)%5];g.fill()}}}g.restore();setMode('auto');$('#speed').value=type.startsWith('artist')?'270':type.startsWith('benham')?'1440':'180';$('#speedValue').textContent=$('#speed').value+'°/秒'}$('#toggleExamples').onclick=()=>{const opened=$('#exampleOptions').classList.toggle('expanded');$('#toggleExamples').setAttribute('aria-expanded',String(opened));$('#toggleExamples').textContent=opened?'收合 ▴':'展開全部 ▾'};document.querySelectorAll('[data-technique]').forEach(b=>b.addEventListener('click',()=>loadTechnique(b.dataset.technique)));$('#toggleTools').onclick=()=>{const opened=$('#toolBody').classList.toggle('open');$('#toggleTools').setAttribute('aria-expanded',String(opened));$('#toggleTools').textContent=opened?'🎨 收合工具 ▴':'🎨 繪畫技巧／工具 ▾'};if(matchMedia('(min-width:721px)').matches){$('#toolBody').classList.add('open');$('#toggleTools').setAttribute('aria-expanded','true')}$('#quickUndo').onclick=()=>$('#undo').click();$('#quickShare').onclick=()=>$('#share').click();$('#undo').onclick=undo;$('#clear').onclick=()=>{saveHistory();pointers.clear();clear()};function exportCanvas(){const out=document.createElement('canvas');out.width=out.height=1000;const x=out.getContext('2d');x.translate(500,500);x.rotate(angle);x.drawImage(off,-500,-500);return out}function download(out){const a=document.createElement('a');a.download='spin-art.png';a.href=out.toDataURL('image/png');a.click()}$('#save').onclick=()=>download(exportCanvas());$('#share').onclick=async()=>{const out=exportCanvas();if(!navigator.share||!navigator.canShare){download(out);return}try{const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png'));if(!blob){download(out);return}const file=new File([blob],'spin-art.png',{type:'image/png'});if(!navigator.canShare({files:[file]})){download(out);return}await navigator.share({files:[file],title:'我的轉盤畫作',text:'看看我用 Spin Art 畫的作品！'})}catch(e){if(e.name!=='AbortError'){console.warn('分享失敗',e);download(out)}}};requestAnimationFrame(frame)})();</script></body></html>
