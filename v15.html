<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V15｜小羽角色模型驗收</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#233b35}*{box-sizing:border-box}body{margin:0;background:#dfebe4;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;max-width:260px;z-index:4;pointer-events:none}header strong{display:inline-block;padding:5px 10px;border-radius:50px;background:#40665e;color:white;font-size:11px;letter-spacing:.15em}h1{font-size:23px;margin:9px 0 4px}header p{font-size:12px;line-height:1.6;margin:0;color:#526e66}.controls{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;left:50%;transform:translateX(-50%);display:flex;gap:7px;justify-content:center;flex-wrap:wrap;width:calc(100% - 20px);max-width:740px}button,a{border:1px solid #b8d2c9;background:#fffdf8ef;border-radius:12px;font-size:12px;padding:11px 13px;font-weight:700;color:#2b584c;box-shadow:0 4px 20px #223c331a;text-decoration:none;cursor:pointer}button.active{background:#3a7666;color:white;border-color:#3a7666}#status{position:fixed;z-index:3;bottom:calc(135px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#4c746b;font-size:12px;pointer-events:none}#error{display:none;position:fixed;left:12px;right:12px;top:34%;padding:22px;background:#633c3c;color:white;border-radius:15px;white-space:pre-wrap;z-index:6}.subtitle{position:fixed;top:calc(13px + env(safe-area-inset-top));right:12px;color:#56786f;font-size:11px;z-index:3} @media(max-width:650px){h1{font-size:20px}.controls button,.controls a{padding:10px 11px}#status{bottom:calc(129px + env(safe-area-inset-bottom))}} </style></head><body>
<canvas id="c" aria-label="小羽 V15 3D GLB 角色，可拖曳旋轉檢查"></canvas><header><strong>CHARACTER LAB · V15</strong><h1>小羽，重新建模</h1><p>單一 GLB 模型 · 正面／側面／背面<br>待機、走路、跑步動作預覽</p></header><div class="subtitle">不影響主遊戲</div><div id="status">正在讀取 GLB 模型…</div><div id="error" role="alert"></div><nav class="controls"><button data-action="idle" class="active">站姿</button><button data-action="walk">走路</button><button data-action="run">跑步</button><button data-view="front" class="active">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button id="spin">旋轉</button><a href="./">主遊戲</a></nav>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=s=>document.querySelector(s),canvas=$('#c'),scene=new THREE.Scene();scene.background=new THREE.Color('#dce9e2');
const cam=new THREE.PerspectiveCamera(33,1,.1,80),rend=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});rend.setPixelRatio(Math.min(devicePixelRatio,1.6));rend.outputColorSpace=THREE.SRGBColorSpace;rend.toneMapping=THREE.ACESFilmicToneMapping;rend.toneMappingExposure=1.45;rend.shadowMap.enabled=true;rend.shadowMap.type=THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight('#ffffff','#6b8e86',2.15));const key=new THREE.DirectionalLight('#fff0d8',2.75);key.position.set(-5,8,7);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=7;key.shadow.camera.bottom=-5;scene.add(key);const fill=new THREE.DirectionalLight('#abdccc',1.3);fill.position.set(5,3,-4);scene.add(fill);
const ground=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshStandardMaterial({color:'#f4f4e9',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const stage=new THREE.Group();scene.add(stage);let rig=null,limbs={},mode='idle',targetYaw=0,yaw=0,spinning=false,t=0,last=performance.now(),dragX=null;
const loader=new GLTFLoader();loader.load('./assets/yu-v15.glb',glb=>{rig=glb.scene;rig.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}if(['HeadPivot','LeftArm','RightArm','LeftLeg','RightLeg','Body'].includes(n.name))limbs[n.name]=n});stage.add(rig);$('#status').textContent='模型已載入 · 拖曳人物旋轉 · 可切換動作'},undefined,e=>{console.error(e);$('#error').style.display='block';$('#error').textContent='GLB 載入失敗，請重新整理。\n'+e.message;$('#status').textContent='無法載入模型'});
function resize(){rend.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<620?37:32;cam.updateProjectionMatrix();cam.position.set(0,2.05,innerWidth<620?8.9:7.4);cam.lookAt(0,1.78,0)}addEventListener('resize',resize);resize();
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{mode=b.dataset.action;document.querySelectorAll('[data-action]').forEach(a=>a.classList.toggle('active',a===b))});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{targetYaw=({front:0,side:Math.PI/2,back:Math.PI})[b.dataset.view];spinning=false;$('#spin').classList.remove('active');document.querySelectorAll('[data-view]').forEach(a=>a.classList.toggle('active',a===b))});$('#spin').onclick=()=>{spinning=!spinning;$('#spin').classList.toggle('active',spinning)};
canvas.addEventListener('pointerdown',e=>{dragX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragX===null)return;targetYaw+=(e.clientX-dragX)*.009;dragX=e.clientX;spinning=false;$('#spin').classList.remove('active');document.querySelectorAll('[data-view]').forEach(a=>a.classList.remove('active'))});canvas.addEventListener('pointerup',()=>dragX=null);canvas.addEventListener('pointercancel',()=>dragX=null);
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;if(spinning)targetYaw+=dt*.6;yaw+=(targetYaw-yaw)*Math.min(1,dt*11);stage.rotation.y=yaw;if(rig){const amp=mode==='idle'?.025:mode==='walk'?.39:.67,f=mode==='idle'?2.5:mode==='walk'?7.6:12;const w=Math.sin(t*f);for(const k of ['LeftArm','RightArm','LeftLeg','RightLeg','HeadPivot'])if(limbs[k])limbs[k].rotation.set(0,0,0);if(limbs.LeftLeg)limbs.LeftLeg.rotation.x=w*amp;if(limbs.RightLeg)limbs.RightLeg.rotation.x=-w*amp;if(limbs.LeftArm)limbs.LeftArm.rotation.x=-w*amp*.74;if(limbs.RightArm)limbs.RightArm.rotation.x=w*amp*.74;if(limbs.HeadPivot){limbs.HeadPivot.rotation.z=Math.sin(t*1.5)*.018;limbs.HeadPivot.rotation.x=Math.sin(t*.9)*.012;}if(limbs.Body)limbs.Body.position.y=(mode==='idle'?Math.sin(t*2)*.008:Math.abs(Math.sin(t*f))*(mode==='run'?.060:.032));}rend.render(scene,cam)}requestAnimationFrame(frame);
addEventListener('error',e=>{console.error(e);const el=$('#error');el.textContent='角色展示發生錯誤：'+e.message;el.style.display='block'});
</script></body></html>
